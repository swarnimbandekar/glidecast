name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build
        run: dotnet build Glidecast.sln -c Release
      - name: Portable package
        shell: pwsh
        run: ./build.ps1 -SkipInstaller
      - uses: actions/upload-artifact@v4
        with:
          name: glidecast-portable
          path: artifacts/*.zip
